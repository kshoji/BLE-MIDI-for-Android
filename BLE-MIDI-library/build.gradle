plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdk = 36

    defaultConfig {
        minSdkVersion 19
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    namespace 'jp.kshoji.blemidi'
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

repositories {
    maven {
        url 'https://github.com/kshoji/javax.sound.midi-for-Android/raw/master/javax.sound.midi/repository'
    }
    mavenCentral()
}

dependencies {
    api 'jp.kshoji:javax-sound-midi:0.0.6:@aar'
    api 'androidx.annotation:annotation:1.9.1'
    compileOnly project(':UnityPlayerMock')
    implementation 'androidx.games:games-activity:4.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    api fileTree(dir: 'libs', include: ['*.jar'])
}

publishing {
    publications {
        release(MavenPublication) {
            group = 'jp.kshoji'
            artifactId = 'ble-midi'
            version = '0.0.21'

            afterEvaluate {
                from components.release
            }
        }
    }

    repositories {
        maven {
            url = "${project.projectDir}/../library/repository"
        }
    }
}
