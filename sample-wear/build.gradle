apply plugin: 'com.android.application'

android {
    compileSdk 34

    defaultConfig {
        applicationId "jp.kshoji.blemidi.sample"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'jp.kshoji.blemidi.sample'
}

repositories {
    google()
    maven {
        url 'https://github.com/kshoji/javax.sound.midi-for-Android/raw/master/javax.sound.midi/repository'
    }
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':BLE-MIDI-library')
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-ambient:1.0.0'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.10.0'
    api 'androidx.annotation:annotation:1.9.1'
}
